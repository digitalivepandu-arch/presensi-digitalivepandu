<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensi Kelas Komputer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda */
            background-color: #0f172a; /* Warna latar belakang selaras dengan form */
        }
        iframe {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- PERHATIKAN ATRIBUT "allow" DI BAWAH INI SANGAT PENTING -->
    <iframe 
        src="https://script.google.com/macros/s/AKfycbxm5VHheXRAdbu5FBev5EIvsWtkiU-v2WbopEQEhYecpDPgzXXWotv8F3B9Fw2TAB2EMw/exec" 
        allowfullscreen="true"
        allow="camera; geolocation; microphone; fullscreen; display-capture"
        sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-top-navigation">
    </iframe>

    <script>
        // Skrip fullscreen bawaan Anda. 
        // Catatan: Browser modern biasanya memblokir auto-fullscreen tanpa klik dari pengguna, 
        // namun tidak masalah tetap dicantumkan.
        window.onload = function() {
            const iframe = document.querySelector('iframe');
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen().catch((err) => {
                    console.log(`Auto-fullscreen diblokir oleh browser (wajar): ${err.message}`);
                }); 
            }
        };
    </script>
</body>
</html>
